# ONGA's development environment (`uv sync`; the Makefile runs everything
# through `uv run`). Not a package. The curation tooling is
# databio/curation-workbench, used as a path dependency: it needs a checkout at
# ../curation-workbench (the `curate` GitHub Action clones it there over https,
# which works once that repo is public).
[project]
name = "onga-dev"
version = "0"
requires-python = ">=3.10"
dependencies = ["linkml~=1.10.0", "pyyaml>=6", "ruamel.yaml>=0.18"]

[dependency-groups]
curation = ["curation-workbench"]

[tool.uv]
package = false
default-groups = ["curation"]

[tool.uv.sources]
curation-workbench = { path = "../curation-workbench", editable = true }
