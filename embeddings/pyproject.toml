[project]
name = "onga-embeddings"
version = "0.1.0"
description = "Compare ONGA terms against genomics ontologies using embeddings"
requires-python = ">=3.10"
dependencies = [
    "pronto>=2.5.0",
    "obonet>=0.3.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["onga_embeddings*"]
