id: https://databio.org/onga/biospecimen
name: biospecimen
title: ONGA Biospecimen Classification Vocabulary
description: >-
  Controlled vocabulary for classifying biological specimens used in genomic
  experiments. Covers tissue types, cell types, developmental stages, and
  experimental conditions.

prefixes:
  linkml: https://w3id.org/linkml/
  onga: https://databio.org/onga/

default_prefix: onga
default_range: string

imports:
  - linkml:types

