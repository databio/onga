id: https://databio.org/onga/strand_orientation
name: strand_orientation
title: ONGA Strand Orientation Vocabulary
description: >-
  Controlled vocabulary of strand orientation. `StrandOrientation` is a Layer-1
  ONGA facet vocabulary (a closed value set): each permissible value names the
  strand a genomic annotation track represents. It factors the strand qualifier
  out of compound ENCODE `output_type` / DataType terms (e.g. "minus strand
  signal", "observed signal profile (plus strand)") so that strand becomes an
  orthogonal facet asserted via the `strand` slot of the `TrackInterpretation`
  descriptor schema, rather than being baked into the interpretation value.


  Aligned with FGA-WG issue #2 (data interpretation): the strand axis is one of
  the orthogonal facets a compound interpretation term collapses. Where a
  Sequence Ontology (SO) term exists for the strand sense, it is referenced via
  `meaning`.

prefixes:
  linkml: https://w3id.org/linkml/
  onga: https://databio.org/onga/
  so: http://purl.obolibrary.org/obo/SO_

default_prefix: onga
default_range: string

imports:
  - linkml:types

enums:
  StrandOrientation:
    description: >-
      Strand orientation of a genomic annotation track, factored out of the
      compound ENCODE output_type / DataType terms.
    permissible_values:
      plus:
        description: 'Features on the forward/plus (+) strand.'
        meaning: so:0001030
      minus:
        description: 'Features on the reverse/minus (−) strand.'
        meaning: so:0001031
      unstranded:
        description: 'No strand distinction / not applicable. This is the default when the strand slot is absent.'
      bidirectional:
        description: 'Features spanning or representing both strands.'
