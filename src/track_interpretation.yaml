id: https://databio.org/onga/track_interpretation
name: track_interpretation
title: ONGA Track Interpretation Schema
description: >-
  Descriptor schema for what the data in a genomic annotation file represents.
  Interpretation has two distinct halves: an *algorithmic* concept (the
  process/output the file represents, e.g. "peaks", "signal") and a *biological*
  concept (the biological entity it represents, e.g. "TF binding site",
  "enhancer"). These map onto the `DataType` and `FeatureType` vocabularies
  defined in file_content.yaml, respectively.


  Ported from / aligned with FGA-WG issue #2 (data interpretation):
  https://github.com/fairtracks/fga-wg (issue #2), which explicitly splits
  interpretation into an algorithmic concept and a biological concept.

prefixes:
  linkml: https://w3id.org/linkml/
  onga: https://databio.org/onga/
  SO: http://purl.obolibrary.org/obo/SO_

default_prefix: onga
default_range: string

imports:
  - linkml:types
  - file_content
  - strand_orientation
  - haplotype_resolution

classes:
  TrackInterpretation:
    description: >-
      What the data in a genomic annotation file represents, split into an
      algorithmic interpretation (output_type, drawing on the DataType
      vocabulary) and a biological interpretation (feature_type, drawing on the
      FeatureType vocabulary). Corresponds to FGA-WG issue #2.
    slots:
      - output_type
      - feature_type
      # Content facet: the SO class(es) the individual rows/records instantiate.
      # `feature_type` names the ONGA **set** term (a file/track whose rows are
      # features); `element_type` names the SO **element** type those rows are
      # instances of. They are deliberately SEPARATE slots — an ONGA term is
      # never equivalent to an SO class (design principle #7). Absent means the
      # rows are not SO-typeable features.
      - element_type
      # Facet slot, factored out of compound DataType strings (e.g.
      # "minus strand signal" -> output_type: signal, strand: minus). See
      # mappings/facet_decomposition.tsv for the full ENCODE round-trip map.
      - strand
      # Content facet: haplotype resolution (allele_specific / haplotype_specific
      # / phased), factored out of compound DataType/FeatureType strings (e.g.
      # "haplotype-specific contact matrix" -> output_type: contact matrix,
      # haplotype_resolution: haplotype_specific). Like strand, this answers what
      # the values represent, so it lives in interpretation, not provenance.
      # Absent = haplotype-collapsed / not phase-resolved.
      - haplotype_resolution
      # Processing/derivation facets (read_multiplicity, filter_status, and the
      # planned normalization / observed-vs-predicted / bias-correction axes)
      # describe *what was done to the data*, not *what it is*, so they live on
      # TrackProvenance (src/track_provenance.yaml), not here.

slots:
  output_type:
    description: >-
      The algorithmic interpretation: the computational process or output the
      file represents (e.g. peaks, signal, alignment, count matrix). Draws on
      the DataType vocabulary.
    range: DataType
    examples:
      - value: peaks
  feature_type:
    description: >-
      The biological interpretation: the biological entity or concept the data
      represents (e.g. TF binding site, enhancer, CpG island). Draws on the
      FeatureType vocabulary.
    range: FeatureType
    examples:
      - value: 'transcription factor binding site'
  element_type:
    description: >-
      The Sequence Ontology class(es) that the individual rows/records of this
      track instantiate. One value = a homogeneous set; several values = a mixed
      set (rows may be instances of any listed class); absent = the rows are not
      SO-typeable features (signal values, matrices, models, edges). This is a
      CONTENT facet — it answers *what the rows are* — so it lives on
      TrackInterpretation, not TrackProvenance (design principle #4). It is the
      slot form of the `onga:has_element_type` relation: an ONGA term denotes a
      SET of elements, an SO class denotes the element type, and ONGA never
      asserts equivalence between them (design principle #7).
    range: uriorcurie
    multivalued: true
    examples:
      - value: SO:0000165
  strand:
    description: >-
      The strand orientation the file represents. Factored out of compound
      DataType terms (e.g. "minus strand signal"). Absent means
      unstranded/unspecified.
    range: StrandOrientation
    examples:
      - value: minus
  haplotype_resolution:
    description: >-
      The haplotype resolution the file represents: whether content is resolved
      to individual alleles (allele_specific), partitioned per parental
      haplotype (haplotype_specific), or phase-resolved without per-haplotype
      splitting (phased). A content facet factored out of compound
      DataType/FeatureType terms (e.g. "haplotype-specific contact matrix",
      "phased variant calls"). Absent means haplotype-collapsed / not
      phase-resolved.
    range: HaplotypeResolution
    examples:
      - value: haplotype_specific
