id: https://databio.org/onga/document
name: document
title: ONGA Document Record
description: >-
  Self-description of a harmonised metadata document — identifiers, deposit
  versioning, sources, and the ontology versions its Term values resolve
  against. Ported from the FGA-WG schema
  (https://w3id.org/fga-wg/schema/document).

annotations:
  onga_layer: 4

prefixes:
  linkml: https://w3id.org/linkml/
  onga: https://databio.org/onga/
  fga: https://w3id.org/fga-wg/schema/
  dcat: http://www.w3.org/ns/dcat#

imports:
  - linkml:types
  - deposit
  - input_source
  - util

default_prefix: onga
default_range: string

classes:
  Document:
    description: 'Information about a document containing metadata about a set of genome annotation files, harmonised according to this schema. This includes self-referential identifiers and versioning of public deposits of the document.'
    source: https://w3id.org/fga-wg/schema/document
    close_mappings:
      - dcat:CatalogRecord
    slots:
      - document_label
      - document_description
      - document_deposit
      - document_input_sources
      - document_ontology_versions

  OntologyVersions:
    description: 'Information about an ontology used in the metadata: a map from the version-agnostic URL to a versioned URL. Version pinning is real work for deposit documents — the OWL versionIRI mechanism serves the same purpose at the ontology level.'
    source: https://w3id.org/fga-wg/schema/document
    see_also:
      - https://www.w3.org/TR/owl2-syntax/#Ontology_IRI_and_Version_IRI
    slots:
      - namespace
      - ontology_url
      - versioned_ontology_url

slots:
  document_label:
    description: 'A human-readable description of the metadata document, short enough to be used for listings within software user interfaces, tables, illustration legends, etc.'
    recommended: true
    range: string
    examples:
      - value: 'IHEC data portal metadata, harmonised to the FGA-WG model.'
  document_description:
    description: 'Human-readable description of the metadata document.'
    range: Any
    any_of:
      - range: string
      - range: uri
    examples:
      - value: 'The metadata contents of the International Human Epigenome Consortium (IHEC) data portal, harmonised to follow the metadata model developed by the "FAIRification of Genomic Annotations WG" in the Research Data Alliance (RDA), enhanced with metadata from original sources.'
  document_deposit:
    description: 'Information about the public deposit of the metadata document.'
    range: Deposit
    inlined: true
    examples:
      - object:
          deposit_id: 'doi:10.1234/zenodo.12345678'
          deposit_versioned_id: 'doi:10.1234/zenodo.12345679'
          deposit_first_created: '2025-07-01T12:36:00Z'
          deposit_last_changed: '2025-07-01T12:36:00Z'
  document_input_sources:
    description: 'References to other input sources from which this entire metadata document was derived, or possibly including DOIs of other metadata documents used as source.'
    range: InputSource
    multivalued: true
    examples:
      - object:
          inputsource_external_ref: 'https://epigenomesportal.ca/ihec/'
          qualified_relation: 'prov:wasDerivedFrom'
  document_ontology_versions:
    description: 'Map from the version-agnostic URL to a versioned URL (e.g. "versionIRI" in owl) of each ontology used in the current metadata deposit (corresponding to deposit_versioned_id").'
    recommended: true
    range: OntologyVersions
    multivalued: true
    examples:
      - object:
          namespace: 'edam'
          ontology_url: 'http://edamontology.org/EDAM.owl'
          versioned_ontology_url: 'http://edamontology.org/EDAM_1.21.owl'
      - object:
          namespace: 'so'
          ontology_url: 'http://purl.obolibrary.org/obo/so.owl'
          versioned_ontology_url: 'http://purl.obolibrary.org/obo/so/2020-08-20/so.owl'
  namespace:
    description: 'The CURIE namespace (prefix) an ontology (e.g. "GO" for Gene Ontology).'
    required: true
    range: string
    examples:
      - value: edam
  ontology_url:
    description: 'The version-agnostic URL of the ontology (e.g. the IRI of the ontology in OWL).'
    required: true
    range: uri
    examples:
      - value: 'http://edamontology.org/EDAM.owl'
  versioned_ontology_url:
    description: 'The versioned URL of the ontology (e.g. the "versionIRI" in OWL).'
    required: true
    range: uri
    examples:
      - value: 'http://edamontology.org/EDAM_1.21.owl'
