id: https://databio.org/onga/access_method
name: access_method
title: ONGA Access Method Record
description: >-
  Description of an access method that can be used to fetch a data file, copied
  from the GA4GH DRS AccessMethod model. Ported from the FGA-WG schema
  (https://w3id.org/fga-wg/schema/access-method). Port notes: the enum
  `AccessMethods` is renamed `AccessProtocol` and the slot `access_method` is
  renamed `access_protocol` (killing the class/enum one-letter near-clash), and
  the slot's range is the enum, not the class (adopting the fga-qg
  add-external-standard-annotations branch's bug fix).

prefixes:
  linkml: https://w3id.org/linkml/
  onga: https://databio.org/onga/
  fga: https://w3id.org/fga-wg/schema/
  ga4gh_drs_info: https://ga4gh.github.io/data-repository-service-schemas/preview/release/drs-1.4.0/
#  ga4gh_drs:  https://w3id.org/ga4gh/schema/drs/1.4.0/

imports:
  - linkml:types
  - access_url

default_prefix: onga
default_range: string

classes:
  AccessMethod:
    description: 'Description of an access method (i.e. communication protocol) that can be used to fetch a File object (orig: DrsObject). Exact copy of the AccessMethod object of the GA4GH DRS data model.'
    conforms_to: "GA4GH DRS 1.4.0"
#    class_uri: ga4gh_drs:AccessMethod
    source: https://w3id.org/fga-wg/schema/access-method
    see_also:
      - ga4gh_drs_info:docs/#tag/AccessMethodModel
    slots:
      - access_protocol
      - access_url
      - region

enums:
  AccessProtocol:
    description: 'Access protocols (i.e. communication protocols) for fetching a data file, following the vocabulary defined in the GA4GH DRS specification (renamed from the FGA-WG enum AccessMethods to avoid the near-clash with the AccessMethod class).'
    source: https://w3id.org/fga-wg/schema/access-method
    see_also:
      - ga4gh_drs_info:docs/#tag/AccessMethodModel/operation/getAccessMethod
    permissible_values:
      s3:
        description: 'Amazon S3 and other S3-compatible bucket.'
        meaning: onga:ONGA_0000276
      gs:
        description: 'Google Cloud Storage (and compatible) bucket.'
        meaning: onga:ONGA_0000277
      ftp:
        description: 'File Transfer Protocol.'
        meaning: onga:ONGA_0000278
      gsiftp:
        description: 'GridFTP protocol (an extension of the File Transfer Protocol (FTP) for grid computing).'
        meaning: onga:ONGA_0000279
      globus:
        description: 'Data transfer via the Globus research cyberinfrastructure (https://www.globus.org/.)'
        meaning: onga:ONGA_0000280
      htsget:
        description: 'GA4GH HTSget standard for retrieving subsections of genomic data (https://www.ga4gh.org/product/htsget/).'
        meaning: onga:ONGA_0000281
      https:
        description: 'Hypertext Transfer Protocol Secure, the standard encrypted protocol used on the web.'
        meaning: onga:ONGA_0000282
      file:
        description: 'For local files accessible via a file URI (e.g., file://path/to/file).'

        meaning: onga:ONGA_0000283
slots:
  access_protocol:
    description: 'Access protocol used to access the File object (orig: DrsObject). Renamed from the FGA-WG slot access_method.'
#    slot_uri: ga4gh_drs:AccessMethod/type
    recommended: true
    range: AccessProtocol
    examples:
      - value: https
  access_url:
    description: 'AccessURL object providing URL and associated HTTP headers to access the File object (orig: DrsObject).'
#    slot_uri: ga4gh_drs:AccessMethod/access_url
    recommended: true
    range: AccessURL
    examples:
      - object:
          url: 'https://epigenomesportal.ca/tracks/ENCODE/hg38/87234.ENCODE.ENCBS004ENC.H3K9me3.peak_calls.bigBed'
  region:
    description: 'Name of the region in the cloud service provider that the object belongs to.'
#    slot_uri: ga4gh_drs:AccessMethod/region
    range: string
    examples: []
