id: https://databio.org/onga/derivation
name: derivation
title: ONGA Derivation Vocabulary
description: >-
  Controlled vocabulary recording the epistemic origin of a file's values: whether
  they were empirically observed (measured from experimental sequencing data) or
  computationally predicted (generated by a statistical/computational model rather
  than directly measured). `Derivation` is a Layer-1 ONGA facet vocabulary (a
  closed value set) and a provenance facet — it records how the values were
  obtained (measured vs. modeled), not what the values mean. It factors the
  measured-vs-model qualifier out of compound ENCODE `output_type` / DataType /
  FeatureType terms (e.g. "observed signal profile" / "predicted signal profile",
  "predicted transcription start sites") so that derivation becomes an orthogonal
  facet asserted via the `derivation` slot of the `TrackProvenance` descriptor
  schema, rather than being baked into the interpretation value. An absent value
  means the derivation is unspecified (NOT a default of observed): the generic
  `signal profile` term carries no derivation value.


  The vocabulary is deliberately two-valued. `control` is EXCLUDED: in the source
  terms "control" denotes unrelated things — an experimental role (control vs.
  treatment) or a normalization reference (control-normalized) — not the
  measured-vs-model axis this facet captures. Control-related terms therefore
  stay as distinct output_type / feature_type values and are not decomposed onto
  this facet.


  Aligned with FGA-WG issue #2 (data interpretation): the measured-vs-model axis
  is one of the orthogonal facets a compound interpretation term collapses, here
  homed on the provenance schema as a processing/derivation operation.

prefixes:
  linkml: https://w3id.org/linkml/
  onga: https://databio.org/onga/

default_prefix: onga
default_range: string

imports:
  - linkml:types

enums:
  Derivation:
    description: >-
      The epistemic origin of a file's values — empirically observed (measured
      from experimental data) vs. computationally predicted (generated by a
      model) — factored out of the compound ENCODE output_type / DataType /
      FeatureType terms. A provenance facet recording how the values were
      obtained, not what they mean. Absent means unspecified (not a default of
      observed). `control` is deliberately excluded: it denotes an experimental
      role or normalization reference, not the measured-vs-model axis.
    permissible_values:
      observed:
        description: >-
          Values empirically measured from experimental sequencing data.
      predicted:
        description: >-
          Values generated by a computational/statistical model (from sequence,
          chromatin features, etc.) rather than directly measured.
