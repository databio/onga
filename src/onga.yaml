id: https://databio.org/onga
name: onga
title: ONGA - Ontology for Genomic Annotations
description: >-
  ONGA describes genomic annotation files — their content, encoding, provenance,
  and research context — in four layers. Layer 1 is a set of closed value
  vocabularies (DataType, FeatureType, Format, the facet vocabularies, and small
  structural vocabularies such as AccessProtocol and BiospecimenClassification).
  Layer 2 is a set of five track-descriptor schemas — classes of slots whose
  ranges draw on the vocabularies: TrackFormat (how a track is encoded, FGA #1),
  TrackInterpretation (what it represents, FGA #2), TrackProvenance (what was
  done to the data — processing/derivation operations), TrackGeometry (its
  structural shape, FGA #3), and ReferenceGenome (the reference assembly it is
  defined against, including the seqcol digests and reference-build sex).
  Layer 3 is the record layer: GenomicAnnotationFile — the class that composes
  the descriptors into a validatable record — plus File and its DRS-shaped
  components (Checksum, AccessMethod, AccessURL, InputSource,
  QualityAssessment). Layer 4 is the investigation layer: the experiment /
  study / analysis / sample / donor / deposit context of the files, ported from
  the FGA-WG schema (https://w3id.org/fga-wg/schema/) with machine-readable
  lineage annotations. Imports and inlined ranges point only downward (Layer 4
  -> 3 -> 2 -> 1); a lower layer refers up only by CURIE value.


  ONGA terms denote **sets** of genomic elements — a file, a track, a set of
  rows. Sequence Ontology terms denote **individual element types**. The two are
  not the same kind of thing and ONGA never asserts equivalence with an SO class.
  Where every member of an ONGA set is an instance of one SO class, ONGA records
  that with `onga:has_element_type`. ONGA is a user of SO, not a competitor to
  it.
annotations:
  onga_layer: 0
