created_on: "2026-05-20T00:00:00"

prefixes:
  linkml: https://w3id.org/linkml/
  onga: https://databio.org/onga/
  edam: http://edamontology.org/
  SO: http://purl.obolibrary.org/obo/SO_
  skos: http://www.w3.org/2004/02/skos/core#
  dcterms: http://purl.org/dc/terms/
  owl: http://www.w3.org/2002/07/owl#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  xsd: http://www.w3.org/2001/XMLSchema#
  fga: https://w3id.org/fga-wg/schema/
  prov: http://www.w3.org/ns/prov#
  dcat: http://www.w3.org/ns/dcat#
  schema: http://schema.org/

default_prefix: onga
default_range: string

imports:
  - linkml:types
  # Layer 1 — closed value vocabularies
  - file_content
  - format
  - strand_orientation
  - haplotype_resolution
  - read_multiplicity
  - filter_status
  - normalization
  - thresholding
  - derivation
  - reference_build_sex
  # Layer 2 — track descriptor schemas
  - track_format
  - track_interpretation
  - track_provenance
  - track_geometry
  - reference_genome
  # Layer 3 — record classes (a record about one file) + helpers
  - term
  - util
  - checksum
  - access_url
  - access_method
  - input_source
  - quality_assessment
  - file
  - genomic_annotation_file
  # Layer 4 — investigation classes (the research and publishing context)
  - experiment
  - analysis
  - study
  - sample
  - donor
  - contact
  - deposit
  - document
  - file_collection
  - top_level
