id: https://databio.org/onga/read_multiplicity
name: read_multiplicity
title: ONGA Read Multiplicity Vocabulary
description: >-
  Controlled vocabulary distinguishing the read mapping-multiplicity subset used
  to compute a signal or count track: all mapped reads versus uniquely-mapping
  reads only. `ReadMultiplicity` is a Layer-1 ONGA facet vocabulary (a closed
  value set), and is read-specific. It factors the mapping-multiplicity
  qualifier out of compound ENCODE `output_type` / DataType terms (e.g. "signal
  of all reads", "sparse gene count matrix of unique reads") so that the read
  subset becomes an orthogonal facet asserted via the `read_multiplicity` slot
  of the `TrackInterpretation` descriptor schema, rather than being baked into
  the interpretation value.


  Aligned with FGA-WG issue #2 (data interpretation): the mapping-multiplicity
  axis is one of the orthogonal facets a compound interpretation term collapses.

prefixes:
  linkml: https://w3id.org/linkml/
  onga: https://databio.org/onga/

default_prefix: onga
default_range: string

imports:
  - linkml:types

enums:
  ReadMultiplicity:
    description: >-
      The read mapping-multiplicity subset used to compute a signal or count
      track (all mapped reads vs uniquely-mapping reads only), factored out of
      the compound ENCODE output_type / DataType terms.
    permissible_values:
      all reads:
        description: 'Signal/counts computed from all mapped reads.'
      unique reads:
        description: 'Signal/counts computed from uniquely-mapping reads only.'
