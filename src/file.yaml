id: https://databio.org/onga/file
name: file
title: ONGA File Record
description: >-
  General information about a data file, largely copied from the GA4GH DRS
  DrsObject model. Ported from the FGA-WG schema
  (https://w3id.org/fga-wg/schema/file). Port notes: the FGA-WG `data_content`
  slot and its ~270-value `OutputType` enum are superseded by ONGA's DataType /
  FeatureType vocabularies plus facets (the content classification lives in
  `track_interpretation` on GenomicAnnotationFile; the lossless crosswalk is
  `mappings/facet_decomposition.tsv`); `file_type` is demoted to optional and
  cross-mapped to `TrackFormat.file_format`; required-slot demotions follow the
  ONGA required-slot policy.

prefixes:
  linkml: https://w3id.org/linkml/
  onga: https://databio.org/onga/
  fga: https://w3id.org/fga-wg/schema/
  ga4gh_drs_info: https://ga4gh.github.io/data-repository-service-schemas/preview/release/drs-1.4.0/
#  ga4gh_drs:  https://w3id.org/ga4gh/schema/drs/1.4.0/

imports:
  - linkml:types
  - access_method
  - checksum
  - input_source
  - quality_assessment
  - term

default_prefix: onga
default_range: string

classes:
  File:
    description: 'General information about a particular data file. Most fields (marked with an asterix*) are copied from the GA4GH DRS DrsObject model, which is the top-level object returned from a DRS server in response to a successful lookup call (i.e. https://ga4gh.github.io/data-repository-service-schemas/preview/release/drs-1.4.0/docs/#tag/Objects).'
    conforms_to: "GA4GH DRS 1.4.0"
#    class_uri: ga4gh_drs:DrsObject
    source: https://w3id.org/fga-wg/schema/file
    see_also:
      - ga4gh_drs_info:docs/#tag/DrsObjectModel
    slots:
      - file_external_id
      - file_id
      - file_name
      - file_label
      - file_description
      - filecollection_refs
      - file_input_sources
      - drs_uri
      - access_methods
      - run_provenance
      - quality_assessments
      - file_type
      - mime_type
      - file_size
      - created_time
      - updated_time
      - file_version
      - checksums

slots:
  file_external_id:
    description: 'External, globally unique identifier for the data file.'
    range: curie
    examples:
      - value: 'encode:ENCFF323LCS'
  file_id:
    description: 'Internal identifier for the data file (unique within the metadata deposit). '
#    slot_uri: ga4gh_drs:DrsObject/id
    required: true
    identifier: true
    range: curie
    examples:
      - value: 'file:ENCFF323LCS'
  file_name:
    description: 'A string that can be used to name a data file. This string is made up of uppercase and lowercase letters, decimal digits, hypen, period, and underscore [A-Za-z0-9.-_]. See http://pubs.opengroup.org/onlinepubs/9699919799/basedefs/V1_chap03.html#tag_03_282 [portable filenames].'
#    slot_uri: ga4gh_drs:DrsObject/name
    range: string
    examples:
      - value: '87234.ENCODE.ENCBS004ENC.H3K9me3.peak_calls.bigBed'
  file_label:
    description: 'A human-readable description of the data file, short enough to be used for listings within software user interfaces, tables, illustration legends, etc.'
    recommended: true
    range: string
    examples:
      - value: 'H3K9me3 ChIP-seq replicated peaks, GRCh38, AG04450'
  file_description:
    description: 'A human readable description of the data file.'
#    slot_uri: ga4gh_drs:DrsObject/description
    range: string
    examples:
      - value: 'H3K9me3 ChIP-seq replicated peaks on human (hg38) AG04450 (Fibroblast derived cell line).'
  filecollection_refs:
    description: 'Internal references to the FileCollection objects (within the deposit) that contains the data file, if any.'
    range: curie
    multivalued: true
    examples:
      - value: 'collection:ihec_encode'
  file_input_sources:
    description: 'External or internal references to data sources for the file, typically a data collection or a process that has generated the file. Internal references should lead to FileCollection, File, Experiment, or Analysis objects.'
    recommended: true
    range: InputSource
    multivalued: true
    examples:
      - object:
          inputsource_ref: 'analysis:ENCAN718KHT'
          qualified_relation: 'prov:wasGeneratedBy'
          biological_replicate_labels: ["1", "2"]
          technical_replicate_labels: ["1_1", "2_1"]
  drs_uri:
    description: 'A drs:// hostname-based URI, as defined in the DRS documentation, that tells clients how to access this object. The intent of this field is to make DRS objects self-contained, and therefore easier for clients to store and pass around. For example, if you arrive at this DRS JSON by resolving a compact identifier-based DRS URI, the self_uri presents you with a hostname and properly encoded DRS ID for use in subsequent access endpoint calls.'
#    slot_uri: ga4gh_drs:DrsObject/self_uri
    range: uri
    examples:
      - value: 'drs://drs.example.org/ENCFF323LCS'
  access_methods:
    description: 'The list of access methods that can be used to fetch the data file. '
#    slot_uri: ga4gh_drs:DrsObject/access_methods
    recommended: true
    range: AccessMethod
    multivalued: true
    examples:
      - object:
          access_protocol: https
          access_url:
            url: 'https://epigenomesportal.ca/tracks/ENCODE/hg38/87234.ENCODE.ENCBS004ENC.H3K9me3.peak_calls.bigBed'
      - object:
          access_protocol: s3
          access_url:
            url: 's3://encode-public/2016/11/13/efd4e74e-7875-4d13-9630-0085bc834f18/ENCFF323LCS.bigBed'
  run_provenance:
    description: 'Document detailing the provenance of the experiment or analysis run which produced the file as one of its outputs. The provenance info should include software versions, parameter settings, etc.'
    range: uriorcurie
    examples:
      - value: 'encode:ENCAN718KHT'
  quality_assessments:
    description: 'An array of QualityAssessment objects containing the main quality scores from assessment techniques applied to the data file.'
    range: QualityAssessment
    multivalued: true
    examples:
      - object:
          assessment_method: 'histone-chipseq-quality-metrics'
          assessment_values:
            nreads: 21018235
            nreads_in_peaks: 6161851
            frip: 0.2931669095906483
          assessment_details_url: 'https://www.encodeproject.org/histone-chipseq-quality-metrics/70ae08dc-3edc-437f-a0a5-378c72e6269b/'
  file_type:
    description: 'The file format of the data file, as an ontology term. For genomic annotation files the authoritative format is `TrackFormat.file_format` (the ONGA Format vocabulary, reached via `track_format` on GenomicAnnotationFile); `file_type` exists for non-annotation files (e.g. FASTQ) that File also covers.'
    close_mappings:
      - onga:file_format
    range: Term
    examples:
      - object:
          id: 'edam:format_3004'
          label: 'bigBed'
  mime_type:
    description: 'A string providing the mime-type of the data file.'
#    slot_uri: ga4gh_drs:DrsObject/mime_type
    range: string
    examples:
      - value: 'application/octet-stream'
  file_size:
    description: 'For blobs, the blob size in bytes. '
#    slot_uri: ga4gh_drs:DrsObject/size
    range: integer
    examples:
      - object: 5359719
  created_time:
    description: 'Timestamp of content creation in RFC3339. (This is the creation time of the underlying content, not of the JSON object.).'
#    slot_uri: ga4gh_drs:DrsObject/created_time
    range: datetime
    examples:
      - value: '2016-11-13T17:42:04.385801+00:00'
  updated_time:
    description: 'Timestamp of content update in RFC3339, identical to created_time in systems that do not support updates. (This is the update time of the underlying content, not of the JSON object.).'
#    slot_uri: ga4gh_drs:DrsObject/updated_time
    range: datetime
    examples:
      - value: '2016-11-13T17:42:04.385801+00:00'
  file_version:
    description: 'A string representing a version. (Some systems may use checksum, a RFC3339 timestamp, or an incrementing version number.).'
#    slot_uri: ga4gh_drs:DrsObject/version
    range: string
    examples:
      - value: 'efd4e74e-7875-4d13-9630-0085bc834f18'
  checksums:
    description: 'A list of checksums of the data file. For blobs, the checksum is computed over the bytes in the blob.'
#    slot_uri: ga4gh_drs:DrsObject/checksums
    recommended: true
    range: Checksum
    multivalued: true
    examples:
      - object:
          checksum: '535bc9628a1c5e5215226f9996e4eaca'
          checksum_type: md5
