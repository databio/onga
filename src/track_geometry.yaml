id: https://w3id.org/onga/track_geometry
name: track_geometry
title: ONGA Track Geometry Vocabulary
description: >-
  Controlled vocabulary for describing the geometric or structural properties
  of genomic tracks and features (strand orientation, resolution, coordinate
  systems).

prefixes:
  linkml: https://w3id.org/linkml/
  onga: https://w3id.org/onga/

default_prefix: onga
default_range: string

imports:
  - linkml:types

