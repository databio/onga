id: https://databio.org/onga/file_collection
name: file_collection
title: ONGA File Collection Record
description: >-
  A collection of files according to some selection criteria. Ported from the
  FGA-WG schema (https://w3id.org/fga-wg/schema/file-collection).

prefixes:
  linkml: https://w3id.org/linkml/
  onga: https://databio.org/onga/
  fga: https://w3id.org/fga-wg/schema/
  dcat: http://www.w3.org/ns/dcat#

imports:
  - linkml:types
  - contact
  - input_source
  - util

default_prefix: onga
default_range: string

classes:
  FileCollection:
    description: 'A collection of files, according to some selection criteria. Mainly intended for GenomicAnnotationFile entities, but other types of files can also be contained in a collection, e.g. raw data files such as FASTQ files. This is the natural future home for the BEDset concept (a curated collection of BED files).'
    source: https://w3id.org/fga-wg/schema/file-collection
    close_mappings:
      - dcat:Dataset
    slots:
      - filecollection_external_id
      - filecollection_id
      - filecollection_label
      - filecollection_description
      - filecollection_input_sources
      - deposit_versioned_ref
      - contact

slots:
  filecollection_external_id:
    description: 'External, globally unique identifier for the file collection (in most cases, this will not exist).'
    range: curie
  filecollection_id:
    description: 'Internal identifier for the file collection (unique within the metadata deposit). '
    required: true
    identifier: true
    range: curie
    examples:
      - value: 'filecollection:ihec_encode'
  filecollection_label:
    description: 'A human-readable description of the file collection, short enough to be used for listings within software user interfaces, tables, illustration legends, etc.'
    recommended: true
    range: string
    examples:
      - value: 'IHEC data portal: ENCODE dataset'
  filecollection_description:
    description: 'Human-readable description of the file collection.'
    range: Any
    any_of:
      - range: string
      - range: uri
    examples:
      - value: 'ENCODE dataset in the International Human Epigenome Consortium (IHEC) data portal, enhanced with metadata from the ENCODE data portal.'
  filecollection_input_sources:
    description: 'References to other input sources from which this file collection was derived.'
    range: InputSource
    multivalued: true
    examples:
      - object:
          inputsource_external_ref: 'https://www.encodeproject.org'
          qualified_relation: 'prov:hadPrimarySource'
  deposit_versioned_ref:
    description: 'Reference to versioned id of deposit containing this file collection.'
    recommended: true
    range: curie
    examples:
      - value: 'doi:10.1234/zenodo.12345679'
