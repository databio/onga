id: https://databio.org/onga/quality_assessment
name: quality_assessment
title: ONGA Quality Assessment Record
description: >-
  Results of a quality assessment applied to a data file (e.g. peak-calling
  statistics, BUSCO scores, BEDbase BedStats-style QC numbers). Ported from the
  FGA-WG schema (https://w3id.org/fga-wg/schema/quality-assessment).

annotations:
  onga_layer: 3

prefixes:
  linkml: https://w3id.org/linkml/
  onga: https://databio.org/onga/
  fga: https://w3id.org/fga-wg/schema/

imports:
  - linkml:types
  - term
  - util

default_prefix: onga
default_range: string

classes:
  QualityAssessment:
    description: 'Represents the results of a quality assessment that has been carried out on a data file resulting from an experiment or analysis. This is the natural home for repository QC metrics (e.g. BEDbase BedStats numbers). A typed QC vocabulary may later tighten assessment_method; for now it accepts a free string or a Term.'
    source: https://w3id.org/fga-wg/schema/quality-assessment
    slots:
      - assessment_method
      - assessment_values
      - assessment_details_url

  AssessmentValue:
    description: 'Key-value pair representing a specific value produced by a quality assessment.'
    source: https://w3id.org/fga-wg/schema/quality-assessment
    slots:
      - key
      - value

slots:
  assessment_method:
    description: 'Quality assessment method that has been carried out (e.g. BUSCO, OMArk, peak calling statistics, etc.)'
    recommended: true
    range: Any
    any_of:
      - range: string
      - range: Term
    examples:
      - value: 'histone-chipseq-quality-metrics'
  assessment_values:
    description: 'Main values produced by the quality assessment.'
    recommended: true
    range: Any
    any_of:
      - range: string
      - range: AssessmentValue
        multivalued: true
    examples:
      - object:
          nreads: 21018235
          nreads_in_peaks: 6161851
          frip: 0.2931669095906483
  assessment_details_url:
    description: 'URL to a report containing the detailed output from the quality assessment.'
    range: uri
    examples:
      - value: 'https://www.encodeproject.org/histone-chipseq-quality-metrics/70ae08dc-3edc-437f-a0a5-378c72e6269b/'
  key:
    description: 'Key/name of the assessment value.'
    required: true
    range: string
    examples:
      - value: 'nreads'
      - value: 'nreads_in_peaks'
      - value: 'frip'
  value:
    description: 'Value corresponding to the assessment key.'
    required: true
    range: Any
    any_of:
      - range: decimal
      - range: boolean
      - range: integer
      - range: string
    examples:
      - object: 21018235
      - object: 6161851
      - object: 0.2931669095906483
