  FeatureType:
    description: "Biological feature types - the biological entity or concept the data \nrepresents. Describes
      WHAT biological phenomenon the features capture.\nExamples: enhancers, TF binding sites, methylation
      states, chromatin loops."
    permissible_values:
      footprints:
        description: Short protected regions within open chromatin indicating transcription factor 
          occupancy, identified as local signal minima within peaks.
        in_subset:
        - chromatin_accessibility
