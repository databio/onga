      chromatin stripes:
        description: Elongated features in contact matrices extending from loop anchors, indicating 
          active loop extrusion.
        in_subset:
        - contact_matrix
      contact domains:
        description: Topologically associating domains (TADs) from contact matrix analysis, 
          representing self-interacting chromatin regions.
        in_subset:
        - contact_matrix
        see_also:
        - contact matrix
      genome compartments:
        description: Large-scale A (active) and B (inactive) chromatin compartments from PCA of Hi-C
          contact matrices.
