id: https://databio.org/onga/file_content
name: file_content
title: ONGA File Content Vocabulary
description: >-
  ONGA (Ontology for Genomic Annotations) provides controlled vocabularies 

  for describing genomic data files. It defines two complementary vocabularies:


  - DataType: Computational output types (HOW data was produced)

  - FeatureType: Biological feature types (WHAT biology it represents)


  A file's DataType describes its computational origin (e.g., "peaks" from a peak caller).

  A file's FeatureType describes what biological phenomenon it captures (e.g., "TF binding sites").

  The same DataType can represent different FeatureTypes depending on the experiment.

  Both vocabularies are **set-denoting**: a DataType or FeatureType term names a file or track whose rows are instances of
  some element type, not the element itself. Where every row instantiates one Sequence Ontology class, that class is recorded
  as the term's `element_type` annotation. ONGA is a user of SO, never a substitute for it.

prefixes:
  linkml: https://w3id.org/linkml/
  onga: https://databio.org/onga/
  edam: http://edamontology.org/
  SO: http://purl.obolibrary.org/obo/SO_
  skos: http://www.w3.org/2004/02/skos/core#

default_prefix: onga
default_range: string

imports:
- linkml:types

subsets:
  alignment:
    description: Aligned sequence reads or assembled sequences mapped to a reference.
  signal_track:
    description: >-
      Quantitative signal values across genomic coordinates including coverage,
      fold change, and p-values.
  peak_set:
    description: Discrete regions of enrichment identified by peak calling algorithms.
  chromatin_accessibility:
    description: Open chromatin regions and nuclease cleavage data from DNase-seq or ATAC-seq.
  contact_matrix:
    description: Pairwise interaction frequency data from chromosome conformation capture experiments.
  dna_methylation:
    description: Methylation state measurements at specific sequence contexts (CpG, CHG, CHH).
  rna_modification:
    description: >-
      Epitranscriptomic modification states including m6A, m5C, inosine,
      pseudouridine, and Nm.
  regulatory_element:
    description: >-
      Predicted or validated cis-regulatory elements including enhancers,
      promoters, and CREs.
  element_gene_linkage:
    description: >-
      Statistical or predicted associations between regulatory elements and
      target genes.
  crispr_screen:
    description: Guide RNA libraries, perturbation signals, and quantifications from CRISPR screens.
  count_matrix:
    description: Sparse or dense count matrices from single-cell or bulk sequencing experiments.
  quantification:
    description: Gene, transcript, exon, or protein expression measurements.
  deep_learning:
    description: >-
      Contribution scores, predicted signals, and outputs from trained genomic
      deep learning models.
  replication_timing:
    description: Replication timing profiles and relative replication signals.
  variant:
    description: SNPs, indels, structural variants, and QTL associations.
  reference:
    description: Genome assemblies, indices, and reference sequences.
  sequence_motif:
    description: Position weight matrices, motif instances, and sequence signatures.
  annotation:
    description: Genome annotations, transcript models, and feature tracks.
  single_cell:
    description: Cell-level coordinates, annotations, and clustering results from single-cell experiments.
  structure:
    description: Three-dimensional structural data and predicted ensembles.
  haplotype:
    description: Haplotype assignments and phased mapping data.
  technical:
    description: Raw instrument output, adapters, barcodes, and technical artifacts.

# ANNOTATION KEYS ON PERMISSIBLE VALUES
# -------------------------------------
# An ONGA DataType or FeatureType term names a SET of genomic elements -- a
# file, a track, a set of rows. A Sequence Ontology class names an INDIVIDUAL
# element type. ONGA never asserts identity, equivalence or hierarchy against an
# SO class (design principle #7; see the ADR "ONGA terms denote sets; SO terms
# denote elements"). Two annotation keys carry the level shift:
#
#   element_type      Pipe-separated ("|") SO CURIEs naming the class(es) the
#                     individual rows/records instantiate. MUST BE A STRING, not
#                     a YAML list -- a list stringifies as
#                     "['SO:0000165', 'SO:0000167']" in gen-owl output. One value
#                     = a homogeneous set; several = a mixed set.
#   element_type_fit  How tightly the SO class fits the members. A curation
#                     grade, not a different relation:
#                       exact           the SO class is the tight fit
#                       approximate     SO's nearest available class; imperfect
#                       broad           all members are instances but the SO
#                                       class is broader -- AN SO GAP, and the
#                                       machine-readable feed into
#                                       proposals/upstream_requests.yaml
#                       not_applicable  reviewed and found to have no SO element
#                                       type (signal values, matrices, models,
#                                       edges). Distinguishes CURATED-NONE from
#                                       NOT-YET-CURATED (an absent annotation).
#
# NEVER use `meaning:` for a cross-reference. `meaning:` sets the permissible
# value's IRI, so an SO CURIE there hijacks the SO class and a repeated EDAM
# CURIE collapses distinct terms into one OWL node. Cross-references belong in
# exact_mappings / close_mappings / broad_mappings (EDAM, set-to-set) or in
# related_mappings (SO, non-membership).
#
# GENERATED, do not hand-edit: on DataType and FeatureType values, the
# *_mappings slots and the element_type / element_type_fit annotations are
# projected from mappings/*.sssom.tsv (the source of truth) by
# scripts/project_mappings.py (`make mappings`).

enums:

  DataType:
    description: "Computational output types - the data structure or processing result \na file contains. Describes HOW data
      was produced or represented.\nExamples: peaks (output of peak caller), signal track, alignments, count matrix."
    permissible_values:
      alignments:
        description: Sequencing reads mapped to positions in a reference genome, typically in BAM/CRAM format with 
          mapping quality scores and alignment coordinates.
        exact_mappings:
        - edam:data_0863
        in_subset:
        - alignment
        keywords:
        - sequencing reads
      alignments with modifications:
        description: Aligned reads preserving base modification information (e.g., methylation from bisulfite-seq or 
          direct detection) encoded in BAM auxiliary fields.
        broad_mappings:
        - edam:data_0863
        in_subset:
        - alignment
      diploid personal genome alignments:
        description: Reads aligned to a diploid personal genome reference including both parental haplotypes, enabling 
          allele-specific analysis.
        broad_mappings:
        - edam:data_0863
        in_subset:
        - alignment
      gene alignments:
        description: Reads or sequences aligned at the gene level.
        in_subset:
        - alignment
      preprocessed alignments:
        description: 'Alignments after preprocessing: duplicate marking, base quality score recalibration, or indel realignment.'
        broad_mappings:
        - edam:data_0863
        in_subset:
        - alignment
      reads:
        description: Raw or minimally processed sequencing reads in FASTQ format, including quality scores and read 
          identifiers.
        annotations:
          element_type: SO:0000150
          element_type_fit: exact
        close_mappings:
        - edam:data_0924
        in_subset:
        - alignment
      redacted alignments:
        description: Alignments with sensitive genomic positions masked or removed for privacy protection in 
          controlled-access data sharing.
        in_subset:
        - alignment
      redacted transcriptome alignments:
        description: Transcriptome-level alignments with sensitive positions redacted.
        in_subset:
        - alignment
      rejected reads:
        description: Reads that failed quality control filters and were excluded from downstream analysis.
        annotations:
          element_type: SO:0000150
          element_type_fit: broad
        in_subset:
        - alignment
      spike-in alignments:
        description: Reads aligned to exogenous spike-in control sequences (e.g., ERCC) for normalization and quality 
          assessment.
        in_subset:
        - alignment
      transcriptome alignments:
        description: Reads aligned to a transcriptome reference (cDNA sequences) rather than the genome.
        broad_mappings:
        - edam:data_0863
        in_subset:
        - alignment
        keywords:
        - gene expression
        - splicing
      base overlap signal:
        description: Signal computed from base-level read overlap counts at each genomic position.
        in_subset:
        - signal_track
      bias-corrected predicted signal profile:
        description: Model-predicted signal after correction for sequence-composition bias.
        in_subset:
        - signal_track
      control normalized signal:
        description: Signal normalized against a matched control experiment to remove background and technical 
          artifacts.
        in_subset:
        - signal_track
      enrichment:
        description: Quantitative enrichment score over background, measuring signal above expected noise level.
        in_subset:
        - signal_track
      fold change over control:
        description: Signal expressed as the ratio of experimental signal to input/control, highlighting enrichment over
          background.
        in_subset:
        - signal_track
        keywords:
        - TF binding
        - histone modifications
      signal:
        description: Quantitative signal track showing per-base or per-bin values across the genome, typically in bigWig
          format.
        in_subset:
        - signal_track
        keywords:
        - gene expression
        - chromatin accessibility
        - TF binding
      signal p-value:
        description: Statistical significance track showing -log10(p-value) of enrichment at each position.
        broad_mappings:
        - edam:data_0951
        in_subset:
        - signal_track
      summed densities signal:
        description: Signal computed as the sum of per-base read densities across the region.
        in_subset:
        - signal_track
      wavelet-smoothed signal:
        description: Signal smoothed using wavelet transform to reduce noise while preserving peak structure.
        in_subset:
        - signal_track

