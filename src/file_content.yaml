        - DHS peaks
        - nuclease cleavage frequency
      open chromatin regions:
        description: Genomic regions of accessible chromatin from ATAC-seq, DNase-seq, or similar 
          assays.
        in_subset:
        - chromatin_accessibility

      # ─── contact_matrix ───────────────────────────────────────────────────
        see_also:
