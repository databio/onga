id: https://databio.org/onga/file_content
name: file_content
title: ONGA File Content Vocabulary
description: >-
  ONGA (Ontology for Genomic Annotations) provides controlled vocabularies 

  for describing genomic data files. It defines two complementary vocabularies:


  - DataType: Computational output types (HOW data was produced)

  - FeatureType: Biological feature types (WHAT biology it represents)


  A file's DataType describes its computational origin (e.g., "peaks" from a peak caller).

  A file's FeatureType describes what biological phenomenon it captures (e.g., "TF binding sites").

  The same DataType can represent different FeatureTypes depending on the experiment.

prefixes:
  linkml: https://w3id.org/linkml/
  onga: https://databio.org/onga/
  edam: http://edamontology.org/
  skos: http://www.w3.org/2004/02/skos/core#

default_prefix: onga
default_range: string

imports:
- linkml:types

subsets:
  alignment:
    description: Aligned sequence reads or assembled sequences mapped to a reference.
  signal_track:
    description: >-
      Quantitative signal values across genomic coordinates including coverage,
      fold change, and p-values.
  peak_set:
    description: Discrete regions of enrichment identified by peak calling algorithms.
  chromatin_accessibility:
    description: Open chromatin regions and nuclease cleavage data from DNase-seq or ATAC-seq.
  contact_matrix:
    description: Pairwise interaction frequency data from chromosome conformation capture 
      experiments.
  dna_methylation:
    description: Methylation state measurements at specific sequence contexts (CpG, CHG, CHH).
  rna_modification:
    description: >-
      Epitranscriptomic modification states including m6A, m5C, inosine,
      pseudouridine, and Nm.
  regulatory_element:
    description: >-
      Predicted or validated cis-regulatory elements including enhancers,
      promoters, and CREs.
  element_gene_linkage:
    description: >-
      Statistical or predicted associations between regulatory elements and
      target genes.
  crispr_screen:
    description: Guide RNA libraries, perturbation signals, and quantifications from CRISPR screens.
  count_matrix:
    description: Sparse or dense count matrices from single-cell or bulk sequencing experiments.
  quantification:
    description: Gene, transcript, exon, or protein expression measurements.
  deep_learning:
    description: >-
      Contribution scores, predicted signals, and outputs from trained genomic
      deep learning models.
  replication_timing:
    description: Replication timing profiles and relative replication signals.
  variant:
    description: SNPs, indels, structural variants, and QTL associations.
  reference:
    description: Genome assemblies, indices, and reference sequences.
  sequence_motif:
    description: Position weight matrices, motif instances, and sequence signatures.
  annotation:
    description: Genome annotations, transcript models, and feature tracks.
  single_cell:
    description: Cell-level coordinates, annotations, and clustering results from single-cell 
      experiments.
  structure:
    description: Three-dimensional structural data and predicted ensembles.
  haplotype:
    description: Haplotype assignments and phased mapping data.
  technical:
    description: Raw instrument output, adapters, barcodes, and technical artifacts.

enums:

  DataType:
    description: "Computational output types - the data structure or processing result \na file contains.
      Describes HOW data was produced or represented.\nExamples: peaks (output of peak caller), signal
      track, alignments, count matrix."
    permissible_values:
      alignments:
        description: Sequencing reads mapped to positions in a reference genome, typically in 
          BAM/CRAM format with mapping quality scores and alignment coordinates.
        meaning: edam:data_0863
        in_subset:
        - alignment
        see_also:
        - sequencing reads
      alignments with modifications:
        description: Aligned reads preserving base modification information (e.g., methylation from 
          bisulfite-seq or direct detection) encoded in BAM auxiliary fields.
        in_subset:
        - alignment
      diploid personal genome alignments:
        description: Reads aligned to a diploid personal genome reference including both parental 
          haplotypes, enabling allele-specific analysis.
        in_subset:
        - alignment
      filtered reads:
        description: Sequencing reads passing quality control filters such as minimum quality score,
          adapter removal, or duplicate marking.
        in_subset:
        - alignment
      gene alignments:
        description: Reads or sequences aligned at the gene level.
        in_subset:
        - alignment
      haplotype-specific alignments:
        description: Reads confidently assigned and aligned to a specific parental haplotype based 
          on phased variant information.
        in_subset:
        - alignment
      preprocessed alignments:
        description: 'Alignments after preprocessing: duplicate marking, base quality score recalibration,
          or indel realignment.'
        in_subset:
        - alignment
      reads:
        description: Raw or minimally processed sequencing reads in FASTQ format, including quality 
          scores and read identifiers.
        meaning: edam:data_0924
        in_subset:
        - alignment
      redacted alignments:
        description: Alignments with sensitive genomic positions masked or removed for privacy 
          protection in controlled-access data sharing.
        in_subset:
        - alignment
      redacted transcriptome alignments:
        description: Transcriptome-level alignments with sensitive positions redacted.
        in_subset:
        - alignment
      redacted unfiltered alignments:
        description: Unfiltered alignments with sensitive positions redacted.
        in_subset:
        - alignment
      rejected reads:
        description: Reads that failed quality control filters and were excluded from downstream 
          analysis.
        in_subset:
        - alignment
      spike-in alignments:
        description: Reads aligned to exogenous spike-in control sequences (e.g., ERCC) for 
          normalization and quality assessment.
        in_subset:
        - alignment
      transcriptome alignments:
        description: Reads aligned to a transcriptome reference (cDNA sequences) rather than the 
          genome.
        in_subset:
        - alignment
        see_also:
        - gene expression
        - splicing
      unfiltered alignments:
        description: Raw alignments before quality filtering, duplicate removal, or other 
          post-processing.
        in_subset:
        - alignment

