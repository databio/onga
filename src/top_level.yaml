id: https://databio.org/onga/top_level
name: top_level
title: ONGA Top-Level Deposit Document
description: >-
  The root container for a harmonised metadata deposit document: inlined lists
  of files, experiments, analyses, samples, donors, and file collections, plus
  the self-describing Document. Ported from the FGA-WG schema
  (https://w3id.org/fga-wg/schema/top_level). Deliberately NOT marked
  tree_root: both standalone GenomicAnnotationFile records and TopLevel
  deposits must validate.

prefixes:
  linkml: https://w3id.org/linkml/
  onga: https://databio.org/onga/
  fga: https://w3id.org/fga-wg/schema/

imports:
  - linkml:types
  - analysis
  - document
  - donor
  - experiment
  - file
  - file_collection
  - genomic_annotation_file
  - sample

default_prefix: onga
default_range: string

classes:
  TopLevel:
    description: 'A document of harmonised metadata for a set of genome annotation files. This is the top-level class to be used as root for a metadata deposit document.'
    source: https://w3id.org/fga-wg/schema/top_level
    slots:
      - document
      - file_collections
      - files
      - experiments
      - analyses
      - samples
      - donors

slots:
  document:
    description: 'Information about this document containing harmonised metadata about a set of genome annotation files. This includes self-referential identifiers and versioning of public deposits of the document.'
    required: true
    range: Document
    inlined: true
  file_collections:
    description: 'Information about collections of files contained in this dataset, each collection defined according to some selection criteria.'
    range: FileCollection
    multivalued: true
    inlined: true
    inlined_as_list: true
  files:
    description: 'Information about particular genome annotation (and other relevant) files.'
    range: File
    multivalued: true
    inlined: true
    inlined_as_list: true
  donors:
    description: 'Information about the donors or complete organisms from which the samples were taken.'
    range: Donor
    multivalued: true
    inlined: true
    inlined_as_list: true
  samples:
    description: 'Information about the biospecimens/samples used as raw material for lab experiments.'
    range: Sample
    multivalued: true
    inlined: true
    inlined_as_list: true
  experiments:
    description: 'Information about sequencing experiments that have been carried out to generate the files.'
    range: Experiment
    multivalued: true
    inlined: true
    inlined_as_list: true
  analyses:
    description: 'Information about computational processing and analyses that have been carried out to generate the files.'
    range: Analysis
    multivalued: true
    inlined: true
    inlined_as_list: true
