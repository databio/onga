id: https://databio.org/onga/sample
name: sample
title: ONGA Sample Record
description: >-
  A biospecimen/sample used as raw material for lab experiments. Ported from
  the FGA-WG schema (https://w3id.org/fga-wg/schema/sample). This class
  realizes the biospecimen module anticipated by ONGA design principle #5:
  sample properties (tissue, cell type, phenotype, donor development stage)
  are delegated to external ontologies (UBERON, CL, CLO, PATO) via Term-valued
  slots, never baked into the content vocabularies. `organism_tissue` is the
  anticipated organism_part landing slot recorded in
  `mappings/scope_delegations.tsv`.

annotations:
  onga_layer: 4

prefixes:
  linkml: https://w3id.org/linkml/
  onga: https://databio.org/onga/
  fga: https://w3id.org/fga-wg/schema/

imports:
  - linkml:types
  - term

default_prefix: onga
default_range: string

classes:
  Sample:
    description: 'Information about a biospecimen/sample used as raw material for lab experiments. Sample properties are ontology-delegated via Term-valued slots (UBERON for tissue, CL for cell type, CLO for cell line, PATO for phenotype), per ONGA design principle #5.'
    source: https://w3id.org/fga-wg/schema/sample
    see_also:
      - https://www.ebi.ac.uk/biosamples/
    slots:
      - sample_external_id
      - sample_id
      - sample_label
      - sample_description
      - donor_organism_ref
      - biospecimen_classification
      - organism_tissue
      - cell_type
      - cell_line
      - other_biospecimen
      - sampling_protocol
      - sample_collection_location
      - sample_collection_date
      - phenotype
      - donor_age
      - donor_development_stage
      - donor_clinical_information

    rules:
      - preconditions:
          slot_conditions:
            biospecimen_classification:
              equals_string: "cell line"
        postconditions:
          slot_conditions:
            cell_line:
              required: true
      - preconditions:
          any_of:
            - slot_conditions:
                biospecimen_classification:
                  equals_string: "in vitro differentiated cells"
            - slot_conditions:
                biospecimen_classification:
                  equals_string: "primary cell"
        postconditions:
          slot_conditions:
            cell_type:
              required: true
      - preconditions:
          any_of:
            - slot_conditions:
                biospecimen_classification:
                  equals_string: "tissue"
            - slot_conditions:
                biospecimen_classification:
                  equals_string: "organoid"
        postconditions:
          slot_conditions:
            organism_tissue:
              required: true

enums:
  BiospecimenClassification:
    description: 'Vocabulary from the ENCODE model describing the general category of biospecimen (see "Properties->classification" in https://www.encodeproject.org/profiles/biosample_type).'
    source: https://www.encodeproject.org/profiles/biosample_type
    permissible_values:
      "cell line":
        meaning: onga:ONGA_0000284
      "in vitro differentiated cells":
        meaning: onga:ONGA_0000285
      "primary cell":
        meaning: onga:ONGA_0000286
      "cell-free sample":
        meaning: onga:ONGA_0000287
      "cloning host":
        meaning: onga:ONGA_0000288
      "tissue":
        meaning: onga:ONGA_0000289
      "whole organisms":
        meaning: onga:ONGA_0000290
      "organoid":
        meaning: onga:ONGA_0000291
      "technical sample":
        meaning: onga:ONGA_0000292

slots:
  sample_external_id:
    description: 'External, globally unique identifier for the biospecimen/sample.'
    recommended: true
    range: curie
    examples:
      - value: 'encode:ENCBS004ENC'
  sample_id:
    description: 'Internal identifier for the biospecimen/sample (unique within the metadata deposit).'
    required: true
    identifier: true
    range: curie
    examples:
      - value: 'sample:ENCBS004ENC'
  sample_label:
    description: 'A human-readable description of the sample, short enough to be used for listings within software user interfaces, tables, illustration legends, etc.'
    recommended: true
    range: string
    examples:
      - value: 'Homo sapiens AG04450 cell line'
  sample_description:
    description: 'Human-readable description of the biospecimen/sample and the sampling process.'
    range: string
    examples:
      - value: 'Homo sapiens AG04450 cell line'
  donor_organism_ref:
    description: 'Internal reference to the donor/organism from which the biospecimen/sample was taken.'
    recommended: true
    range: curie
    examples:
      - value: 'donor:ENCDO001AAA'
  biospecimen_classification:
    description: 'Main type of structural unit to be used for classification of the biospecimen/sample.'
    recommended: true
    range: BiospecimenClassification
    examples:
      - value: 'cell line'
  organism_tissue:
    description: 'Part of organism (typically tissue or organ) from which the biospecimen/sample was taken, or cell line was derived from. UBERON range; this is the organism_part landing slot anticipated by mappings/scope_delegations.tsv.'
    range: Term
    examples:
      - object:
          id: 'UBERON:0002048'
          label: 'lung'
  cell_type:
    description: 'Cell type of isolated normal cells in the biospecimen/sample.'
    range: Term
  cell_line:
    description: 'Cultured cell line used in the biospecimen/sample.'
    range: Term
    examples:
      - object:
          id: 'CLO:0034832'
          label: 'AG04450 cell'
  other_biospecimen:
    description: 'Other biospecimen-related terms that can be used to further classify the biospecimen/sample.'
    range: Term
    multivalued: true
    examples:
      - object:
          id: 'UBERON:0002384'
          label: 'connective tissue'
      - object:
          id: 'CL:0000057'
          label: 'fibroblast'
  sampling_protocol:
    description: 'Protocol detailing the collection and treatment of the biospecimen/sample.'
    range: uri
    examples:
      - value: 'https://www.encodeproject.org/documents/3ed29dac-da67-47be-91b0-c9cad6a1b791/@@download/attachment/AG04450_Stam_protocol.pdf'
  sample_collection_location:
    description: 'Geographical location where the sample was collected.'
    # TODO: change to a more specific type for geographical locations
    range: string
  sample_collection_date:
    description: 'Date of sample collection.'
    range: datetime
  phenotype:
    description: 'Main phenotype (e.g. disease) connected to the biospecimen/sample.'
    range: Term
    examples:
      - object:
          id: 'PATO:0000461'
          label: 'normal'
  donor_age:
    description: 'Age of the donor/organism at the time of sampling'
    range: string
    # TODO: ISO 8601 duration format not supported in linkml
    examples:
      - value: 'W12'
  donor_development_stage:
    description: 'Development stage of the donor at the time of sampling.'
    range: Term
    examples:
      - object:
          id: 'UBERON:0000323'
          label: 'late embryo'
  donor_clinical_information:
    description: 'Clinical information of the donor/organism at the time of sampling.'
    range: string
    examples:
      - value: 'apparently healthy'
