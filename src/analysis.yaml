id: https://databio.org/onga/analysis
name: analysis
title: ONGA Analysis Record
description: >-
  The computational processing applied to data from a sequencing experiment or
  another analysis. Ported from the FGA-WG schema
  (https://w3id.org/fga-wg/schema/analysis).

annotations:
  onga_layer: 4

prefixes:
  linkml: https://w3id.org/linkml/
  onga: https://databio.org/onga/
  fga: https://w3id.org/fga-wg/schema/
  prov: http://www.w3.org/ns/prov#

imports:
  - linkml:types
  - input_source
  - term

default_prefix: onga
default_range: string

classes:
  Analysis:
    description: 'Represents the computational processing applied to data from a sequencing experiment, or from another analysis. This can be described at the level of individual analysis steps in a workflow/pipeline, or more generally for the workflow/pipeline as a whole. Boundary with TrackProvenance: TrackProvenance (Layer 2) carries faceted, closed-vocabulary descriptors of what was done to the CONTENT (read selection, filtering, normalization, ...); Analysis is the record of the ACTIVITY itself (workflow, tool, version, inputs). Complementary, not competing.'
    source: https://w3id.org/fga-wg/schema/analysis
    close_mappings:
      - prov:Activity
    see_also:
      - https://www.commonwl.org/
      - https://workflowhub.eu/
    slots:
      - analysis_external_id
      - analysis_id
      - analysis_label
      - analysis_description
      - analysis_study_ref
      - analysis_input_sources
      - analysis_type
      - analysis_main_tool
      - analysis_main_tool_version
      - analysis_protocol
      - analysis_workflow

slots:
  analysis_external_id:
    description: 'External, globally unique identifier for the analysis.'
    range: curie
    examples:
      - value: 'encode:ENCAN718KHT'
  analysis_id:
    description: 'Internal identifier for the analysis (unique within the metadata deposit). '
    required: true
    identifier: true
    range: curie
    examples:
      - value: 'analysis:ENCAN718KHT'
  analysis_label:
    description: 'A human-readable description of the analysis, short enough to be used for listings within software user interfaces, tables, illustration legends, etc.'
    recommended: true
    range: string
    examples:
      - value: 'ENCODE3 ChIP-seq pipeline, GRCH38, replicated peak calling'
  analysis_description:
    description: 'Human-readable description of the analysis.'
    range: string
    examples:
      - value: 'ENCODE3 ChIP-seq pipeline on GRCH38 with replicated peak calling using MACS.'
  analysis_study_ref:
    description: 'Internal reference to the study within which the analysis has been carried out.'
    range: curie
    examples:
      - value: 'study:S-EPMC7391744'
  analysis_input_sources:
    description: 'External or internal references to the data sources used as input to the analysis.'
    recommended: true
    range: InputSource
    multivalued: true
    examples:
      - object:
          inputsource_ref: 'experiment:ENCSR000DPJ'
          qualified_relation: 'prov:wasInformedBy'
          biological_replicate_labels: ['1', '2']
          technical_replicate_labels: ['1_1', '2_1']
      - object:
          inputsource_external_ref: 'https://www.encodeproject.org/files/GRCh38_no_alt_analysis_set_GCA_000001405.15'
          qualified_relation: 'https://bioschemas.org/FormalParameter'
          biological_replicate_labels: ['1', '2']
          technical_replicate_labels: ['1_1', '2_1']
          date_of_retrieval: '2016-04-19'
  analysis_type:
    description: 'The type of analysis carried out.'
    recommended: true
    range: Term
    examples:
      - object:
          id: 'edam:operation_3222'
          label: 'Peak calling'
  analysis_main_tool:
    description: 'Main software tool used for the analysis.'
    range: Any
    any_of:
      - range: string
      - range: curie
    examples:
      - value: 'biotools:macs'
  analysis_main_tool_version:
    description: 'Version of the main software tool used for the analysis.'
    range: string
    examples:
      - value: "2.10"
  analysis_protocol:
    description: 'Document describing the analysis protocol that was followed.'
    range: uriorcurie
    examples:
      - value: 'https://www.encodeproject.org/documents/7009beb8-340b-4e71-b9db-53bb020c7fe2/@@download/attachment/ChIP-seq_pipeline_overview.pdf'
  analysis_workflow:
    description: 'External reference to the analysis workflow, with availability in at least one machine-operable form (e.g. CWL, Nextflow, ...).'
    range: uriorcurie
    examples:
      - value: 'encode:ENCPL272XAE'
