id: https://databio.org/onga/genomic_annotation_file
name: genomic_annotation_file
title: ONGA Genomic Annotation File Record
description: >-
  The record class for a genomic annotation / track file: a File that composes
  the five ONGA Layer-2 descriptor schemas (ReferenceGenome, TrackFormat,
  TrackInterpretation, TrackProvenance, TrackGeometry) into a validatable
  record. Ported from the FGA-WG schema
  (https://w3id.org/fga-wg/schema/genomic-annotation-file). Port notes: the
  FGA-WG slot `genome_assembly` is renamed `reference_genome` (range: the
  ReferenceGenome descriptor, which absorbed GenomeAssembly); `sequence_features`
  (an open Term list) is superseded by the closed FeatureType vocabulary reached
  via `track_interpretation.feature_type`, whose terms carry `element_type` SO
  annotations.

annotations:
  onga_layer: 3

prefixes:
  linkml: https://w3id.org/linkml/
  onga: https://databio.org/onga/
  fga: https://w3id.org/fga-wg/schema/

imports:
  - linkml:types
  - file
  - reference_genome
  - track_format
  - track_interpretation
  - track_provenance
  - track_geometry

default_prefix: onga
default_range: string

classes:
  GenomicAnnotationFile:
    is_a: File
    description: 'Information about a genomic annotation / track file. GenomicAnnotationFile is a specification of the File entity and inherits all the fields defined in File, in addition to the fields that are specific to GenomicAnnotationFile, as detailed here. This is the class that composes the five ONGA descriptor schemas: the required reference_genome (the coordinate system) plus the recommended track_format, track_interpretation, track_provenance, and track_geometry descriptors.'
    source: https://w3id.org/fga-wg/schema/genomic-annotation-file
    slots:
      - genomic_annotation_digest
      - reference_genome
      - track_format
      - track_interpretation
      - track_provenance
      - track_geometry

slots:
  genomic_annotation_digest:
    description: 'Content-derived digest for distributed identification of genomic annotation files. (This field is currently a placeholder, as an algorithm for generating such a digest is yet to be specified.).'
    range: curie
  reference_genome:
    description: 'The reference genome the annotation is defined against, consequently defining the genomic coordinate system for the annotation. Renamed from the FGA-WG slot genome_assembly; the range is the ONGA ReferenceGenome descriptor schema. Required: a genomic annotation without a coordinate system is not a genomic annotation.'
    required: true
    range: ReferenceGenome
    inlined: true
  track_format:
    description: 'How the track is encoded on disk: the TrackFormat descriptor (file_format drawing on the Format vocabulary, plus BED column conventions).'
    recommended: true
    range: TrackFormat
    inlined: true
  track_interpretation:
    description: 'What the track content represents: the TrackInterpretation descriptor (output_type / feature_type drawing on the DataType and FeatureType vocabularies, plus the content facets).'
    recommended: true
    range: TrackInterpretation
    inlined: true
  track_provenance:
    description: 'What was done to the data: the TrackProvenance descriptor (processing/derivation facets such as read_multiplicity, filter_status, normalization, thresholding, derivation).'
    recommended: true
    range: TrackProvenance
    inlined: true
  track_geometry:
    description: 'Geometric properties of the sequence features in the genomic annotation file if considered as an one-dimensional genome browser track (also relevant for non-visual analyses).'
    recommended: true
    range: TrackGeometry
    inlined: true
