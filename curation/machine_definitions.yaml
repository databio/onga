# machine_definitions.yaml
#
# Term descriptions written by a program, not a curator: the ENHANCED_DEFINITIONS
# of the deleted scripts/enhance_definitions.py, keyed by term SID. A term whose
# live description still equals its entry here is flagged `machine_definition`
# in curation/status.json until a curator edits or keeps it.
#
#   definitions:  [{subject, label, description}]  label is informational
#   retired:      [{label, description}]  entries whose label no longer resolves

version: 1
definitions:
- subject: term:ONGA_0000001
  label: alignments
  description: Sequencing reads mapped to positions in a reference genome, typically in BAM/CRAM format with mapping 
    quality scores and alignment coordinates.
- subject: term:ONGA_0000002
  label: alignments with modifications
  description: Aligned reads preserving base modification information (e.g., methylation from bisulfite-seq or direct 
    detection) encoded in BAM auxiliary fields.
- subject: term:ONGA_0000003
  label: diploid personal genome alignments
  description: Reads aligned to a diploid personal genome reference including both parental haplotypes, enabling 
    allele-specific analysis.
- subject: term:ONGA_0000005
  label: preprocessed alignments
  description: 'Alignments after preprocessing: duplicate marking, base quality score recalibration, or indel realignment.'
- subject: term:ONGA_0000006
  label: reads
  description: Raw or minimally processed sequencing reads in FASTQ format, including quality scores and read 
    identifiers.
- subject: term:ONGA_0000007
  label: redacted alignments
  description: Alignments with sensitive genomic positions masked or removed for privacy protection in controlled-access
    data sharing.
- subject: term:ONGA_0000009
  label: rejected reads
  description: Reads that failed quality control filters and were excluded from downstream analysis.
- subject: term:ONGA_0000010
  label: spike-in alignments
  description: Reads aligned to exogenous spike-in control sequences (e.g., ERCC) for normalization and quality 
    assessment.
- subject: term:ONGA_0000011
  label: transcriptome alignments
  description: Reads aligned to a transcriptome reference (cDNA sequences) rather than the genome.
- subject: term:ONGA_0000017
  label: signal
  description: Quantitative signal track showing per-base or per-bin values across the genome, typically in bigWig 
    format.
- subject: term:ONGA_0000016
  label: fold change over control
  description: Signal expressed as the ratio of experimental signal to input/control, highlighting enrichment over 
    background.
- subject: term:ONGA_0000014
  label: control normalized signal
  description: Signal normalized against a matched control experiment to remove background and technical artifacts.
- subject: term:ONGA_0000018
  label: signal p-value
  description: Statistical significance track showing -log10(p-value) of enrichment at each position.
- subject: term:ONGA_0000015
  label: enrichment
  description: Quantitative enrichment score over background, measuring signal above expected noise level.
- subject: term:ONGA_0000012
  label: base overlap signal
  description: Signal computed from base-level read overlap counts at each genomic position.
- subject: term:ONGA_0000020
  label: wavelet-smoothed signal
  description: Signal smoothed using wavelet transform to reduce noise while preserving peak structure.
- subject: term:ONGA_0000019
  label: summed densities signal
  description: Signal computed as the sum of per-base read densities across the region.
- subject: term:ONGA_0000013
  label: bias-corrected predicted signal profile
  description: Model-predicted signal after correction for sequence-composition bias.
- subject: term:ONGA_0000027
  label: peaks
  description: Discrete genomic regions of statistically significant enrichment from peak calling. The fundamental unit 
    of ChIP-seq and ATAC-seq analysis.
- subject: term:ONGA_0000032
  label: replicated peaks
  description: Peaks reproducibly called across biological or technical replicates.
- subject: term:ONGA_0000025
  label: IDR ranked peaks
  description: Peaks ranked by IDR score, with lower IDR indicating higher reproducibility across replicates.
- subject: term:ONGA_0000022
  label: conservative IDR thresholded peaks
  description: Peaks using a conservative (stricter) IDR cutoff, yielding high-confidence but smaller peak set.
- subject: term:ONGA_0000026
  label: optimal IDR thresholded peaks
  description: Peaks using the optimal IDR cutoff balancing sensitivity and reproducibility.
- subject: term:ONGA_0000034
  label: representative IDR thresholded peaks
  description: A representative set of IDR-thresholded peaks selected for downstream analysis.
- subject: term:ONGA_0000030
  label: pseudoreplicated IDR thresholded peaks
  description: IDR-thresholded peaks from pseudoreplicates (subsampled reads) when true replicates unavailable.
- subject: term:ONGA_0000031
  label: pseudoreplicated peaks
  description: Peak calls from pseudoreplicates created by subsampling reads from a single experiment.
- subject: term:ONGA_0000028
  label: peaks and background as input for IDR
  description: Combined peak and background signal data formatted as input for IDR analysis.
- subject: term:ONGA_0000021
  label: bidirectional peaks
  description: Peaks from bidirectional transcription signal, characteristic of active enhancers and promoters.
- subject: term:ONGA_0000035
  label: unidirectional peaks
  description: Peaks from unidirectional transcription signal, typically associated with gene bodies.
- subject: term:ONGA_0000024
  label: divergent peaks
  description: Peaks from divergent transcription where initiation occurs in both directions from a central point.
- subject: term:ONGA_0000023
  label: distal peaks
  description: Peaks located distal (>2-3kb) from transcription start sites, often representing enhancers.
- subject: term:ONGA_0000029
  label: proximal peaks
  description: Peaks located proximal (<2-3kb) to transcription start sites, often representing promoters.
- subject: term:ONGA_0000036
  label: valleys
  description: Local minima in signal tracks used in footprint detection or nucleosome positioning analysis.
- subject: term:ONGA_0000038
  label: DHS peaks
  description: Peak calls from DNase I hypersensitivity sequencing (DNase-seq), indicating open chromatin regions.
- subject: term:ONGA_0000037
  label: consensus DNase hypersensitivity sites
  description: DNase I hypersensitivity sites consistently identified across multiple samples or cell types.
- subject: term:ONGA_0000033
  label: representative DNase hypersensitivity sites
  description: A curated representative set of DNase hypersensitivity sites for reference.
- subject: term:ONGA_0000164
  label: open chromatin regions
  description: Genomic regions of accessible chromatin from ATAC-seq, DNase-seq, or similar assays.
- subject: term:ONGA_0000163
  label: footprints
  description: Short protected regions within open chromatin indicating transcription factor occupancy, identified as 
    local signal minima within peaks.
- subject: term:ONGA_0000041
  label: hotspots
  description: Broad regions of elevated DNase cleavage activity representing domains of chromatin accessibility.
- subject: term:ONGA_0000044
  label: nuclease cleavage frequency
  description: Per-base frequency of DNase I or Tn5 transposase cleavage across the genome.
- subject: term:ONGA_0000040
  label: FDR cut rate
  description: False discovery rate-controlled cut rate signal from DNase-seq analysis.
- subject: term:ONGA_0000045
  label: contact matrix
  description: Genome-wide matrix of chromatin interaction frequencies from Hi-C or similar chromosome conformation 
    capture experiments.
- subject: term:ONGA_0000169
  label: loops
  description: Chromatin loop interactions (point-to-point contacts) from contact matrices, often connecting enhancers 
    to promoters.
- subject: term:ONGA_0000166
  label: contact domains
  description: Topologically associating domains (TADs) from contact matrix analysis, representing self-interacting 
    chromatin regions.
- subject: term:ONGA_0000170
  label: nested contact domains
  description: Hierarchically nested topological domains showing multi-scale chromatin organization.
- subject: term:ONGA_0000167
  label: genome compartments
  description: Large-scale A (active) and B (inactive) chromatin compartments from PCA of Hi-C contact matrices.
- subject: term:ONGA_0000168
  label: genome subcompartments
  description: Fine-grained chromatin compartments (A1, A2, B1, B2, B3, B4) within major A/B compartments.
- subject: term:ONGA_0000165
  label: chromatin stripes
  description: Elongated features in contact matrices extending from loop anchors, indicating active loop extrusion.
- subject: term:ONGA_0000046
  label: pairs
  description: Raw read pair data from Hi-C or proximity ligation before matrix construction.
- subject: term:ONGA_0000175
  label: methylation state at CpG
  description: DNA methylation status (methylated/unmethylated fraction) at CpG dinucleotides, the primary context for 
    mammalian methylation.
- subject: term:ONGA_0000173
  label: methylation state at CHG
  description: DNA methylation status at CHG sequence context (H = A, C, or T), common in plant genomes.
- subject: term:ONGA_0000174
  label: methylation state at CHH
  description: DNA methylation status at CHH sequence context, representing asymmetric non-CpG methylation.
- subject: term:ONGA_0000176
  label: smoothed methylation state at CpG
  description: CpG methylation values smoothed across neighboring sites to reduce noise.
- subject: term:ONGA_0000171
  label: CpG sites coverage
  description: Sequencing read coverage at CpG positions, indicating measurement confidence.
- subject: term:ONGA_0000172
  label: methylated reads
  description: Reads containing DNA methylation marks from bisulfite or direct detection methods.
- subject: term:ONGA_0000177
  label: candidate Cis-Regulatory Elements
  description: Computationally predicted cis-regulatory elements (CREs) including enhancers, promoters, and insulators 
    from chromatin accessibility and histone data.
- subject: term:ONGA_0000178
  label: candidate enhancers
  description: Computationally predicted enhancer elements based on chromatin signatures (H3K4me1, H3K27ac, 
    accessibility).
- subject: term:ONGA_0000179
  label: candidate promoters
  description: Computationally predicted promoter elements based on chromatin signatures and TSS proximity.
- subject: term:ONGA_0000186
  label: regulatory elements
  description: 'General annotation of regulatory elements: enhancers, promoters, silencers, and insulators.'
- subject: term:ONGA_0000187
  label: transcription start sites
  description: Experimentally determined transcription start sites (TSS) from CAGE, PRO-seq, or similar assays.
- subject: term:ONGA_0000183
  label: polyA sites
  description: Polyadenylation signal sites where pre-mRNA is cleaved and polyadenylated.
- subject: term:ONGA_0000180
  label: curated binding sites
  description: Manually curated and validated transcription factor binding sites.
- subject: term:ONGA_0000048
  label: enhancer prediction model
  description: Model predicting enhancer activity from sequence or chromatin features.
- subject: term:ONGA_0000093
  label: promoter prediction model
  description: Computational model trained to predict promoter activity from sequence.
- subject: term:ONGA_0000049
  label: regulatory elements prediction model
  description: Computational model for predicting regulatory element activity and location.
- subject: term:ONGA_0000070
  label: gene quantifications
  description: Expression quantifications at gene level as read counts, TPM, or FPKM values.
- subject: term:ONGA_0000081
  label: transcript quantifications
  description: Expression quantifications at transcript isoform level.
- subject: term:ONGA_0000069
  label: exon quantifications
  description: Read counts or expression values quantified at individual exons.
- subject: term:ONGA_0000075
  label: microRNA quantifications
  description: Expression quantifications of microRNAs (miRNAs).
- subject: term:ONGA_0000066
  label: differential expression quantifications
  description: Statistical results from differential expression analysis comparing conditions.
- subject: term:ONGA_0000067
  label: differential splicing quantifications
  description: Statistical results from differential splicing analysis comparing conditions.
- subject: term:ONGA_0000078
  label: peptide quantifications
  description: Abundance measurements of peptides from mass spectrometry proteomics.
- subject: term:ONGA_0000079
  label: protein expression quantifications
  description: Abundance measurements of proteins from proteomics data.
- subject: term:ONGA_0000071
  label: gene stabilities
  description: Measurements of mRNA or gene expression stability over time.
- subject: term:ONGA_0000076
  label: mRNA stabilities
  description: Measurements of mRNA half-life or decay rates.
- subject: term:ONGA_0000061
  label: sparse gene count matrix
  description: Sparse matrix of gene-level read counts across cells or samples, standard for single-cell RNA-seq.
- subject: term:ONGA_0000062
  label: sparse peak count matrix
  description: Sparse matrix of peak accessibility counts across cells, used in single-cell ATAC-seq.
- subject: term:ONGA_0000063
  label: sparse transcript count matrix
  description: Sparse matrix of transcript-level counts across cells or samples.
- subject: term:ONGA_0000060
  label: fold over change matrix
  description: Matrix of fold-change values relative to control across features.
- subject: term:ONGA_0000065
  label: z scores matrix
  description: Matrix of z-score normalized values across features and samples.
- subject: term:ONGA_0000064
  label: TF peaks matrix
  description: Matrix of transcription factor peak counts across samples.
- subject: term:ONGA_0000090
  label: models
  description: Trained computational or machine learning models saved for prediction or interpretation.
- subject: term:ONGA_0000085
  label: bias models
  description: Trained models capturing sequencing bias patterns based on sequence composition.
- subject: term:ONGA_0000091
  label: motif model
  description: Sequence motif model (e.g., convolutional filter weights) from deep learning or motif discovery.
- subject: term:ONGA_0000100
  label: TF binding prediction model
  description: Deep learning model predicting transcription factor binding from DNA sequence.
- subject: term:ONGA_0000086
  label: counts sequence contribution scores
  description: Per-nucleotide importance scores explaining sequence contribution to predicted counts (e.g., DeepLIFT, 
    integrated gradients).
- subject: term:ONGA_0000092
  label: profile sequence contribution scores
  description: Per-nucleotide importance scores explaining sequence contribution to predicted signal profiles.
- subject: term:ONGA_0000087
  label: DNN-MPRA contribution scores
  description: Nucleotide contribution scores from a deep neural network trained on MPRA data.
- subject: term:ONGA_0000088
  label: DNN-MPRA predicted signal
  description: Regulatory activity signal predicted by a DNN trained on MPRA data.
- subject: term:ONGA_0000089
  label: model performance metrics
  description: Evaluation metrics (AUC, correlation, etc.) assessing predictive model performance.
- subject: term:ONGA_0000102
  label: training set
  description: Data used to train a computational or machine learning model.
- subject: term:ONGA_0000101
  label: training and test regions
  description: Genomic regions designated for model training and held-out evaluation.
- subject: term:ONGA_0000203
  label: variant calls
  description: Called genomic variants (SNPs, indels, structural variants) in VCF format.
- subject: term:ONGA_0000199
  label: eQTLs
  description: 'Expression quantitative trait loci: variants statistically associated with gene expression levels.'
- subject: term:ONGA_0000198
  label: dsQTLs
  description: 'DNase I sensitivity quantitative trait loci: variants associated with chromatin accessibility.'
- subject: term:ONGA_0000103
  label: fine-mapped variants
  description: Variants identified as likely causal through statistical fine-mapping within associated loci.
- subject: term:ONGA_0000195
  label: allele-specific variants
  description: Variants showing allele-specific behavior in expression or chromatin accessibility.
- subject: term:ONGA_0000196
  label: copy number variation
  description: Genomic regions with altered copy numbers (deletions, duplications) relative to reference.
- subject: term:ONGA_0000197
  label: curated SNVs
  description: Manually curated and validated single nucleotide variants.
- subject: term:ONGA_0000109
  label: genome reference
  description: Reference genome sequence assembly used for alignment and annotation.
- subject: term:ONGA_0000108
  label: genome index
  description: Precomputed index enabling rapid sequence alignment to a reference genome.
- subject: term:ONGA_0000120
  label: transcriptome reference
  description: Reference transcript sequences for a species, used for RNA-seq alignment.
- subject: term:ONGA_0000119
  label: transcriptome index
  description: Index for rapid alignment to transcriptome reference sequences.
- subject: term:ONGA_0000105
  label: chromosome sizes
  description: File listing chromosome/contig names and lengths, required by many genomics tools.
- subject: term:ONGA_0000106
  label: chromosomes reference
  description: Reference sequences for individual chromosomes.
- subject: term:ONGA_0000112
  label: mitochondrial genome reference
  description: Reference sequence for the mitochondrial genome.
- subject: term:ONGA_0000111
  label: mitochondrial genome index
  description: Alignment index for the mitochondrial genome.
- subject: term:ONGA_0000128
  label: cell coordinates
  description: Low-dimensional coordinates (UMAP, t-SNE, PCA) for single-cell visualization.
- subject: term:ONGA_0000221
  label: cell type annotations
  description: Cell type labels assigned to individual cells based on marker genes or reference mapping.
- subject: term:ONGA_0000130
  label: clusters
  description: Cell cluster assignments from unsupervised clustering of single-cell data.
- subject: term:ONGA_0000127
  label: archr project
  description: ArchR software project file with processed single-cell ATAC-seq data and analyses.
- subject: term:ONGA_0000129
  label: cell topic participation
  description: Cell-level participation scores in latent topics from topic modeling.
- subject: term:ONGA_0000223
  label: 3D structure
  description: Three-dimensional structural model of a genomic region or chromatin domain.
- subject: term:ONGA_0000224
  label: contigs
  description: Assembled sequence contigs from genome assembly.
- subject: term:ONGA_0000225
  label: personalized genome assembly
  description: Genome assembly incorporating an individual's sequence variation.
- subject: term:ONGA_0000226
  label: predicted 3D structural ensembles
  description: Computationally predicted ensembles of 3D genomic structures.
- subject: term:ONGA_0000227
  label: maternal haplotype mapping
  description: Sequence reads or contigs assigned to the maternal haplotype.
- subject: term:ONGA_0000228
  label: paternal haplotype mapping
  description: Sequence reads or contigs assigned to the paternal haplotype.
- subject: term:ONGA_0000152
  label: spike-ins
  description: Exogenous sequences of known concentration added for normalization (e.g., ERCC RNA spike-ins).
- subject: term:ONGA_0000151
  label: sequence barcodes
  description: Short DNA sequences labeling samples (multiplexing) or individual cells (single-cell).
- subject: term:ONGA_0000150
  label: sequence adapters
  description: Adapter sequences ligated to library fragments for sequencing platform compatibility.
- subject: term:ONGA_0000132
  label: exclusion list regions
  description: Genomic blacklist regions excluded due to mapping artifacts or technical issues.
- subject: term:ONGA_0000142
  label: mitochondrial exclusion list regions
  description: Mitochondrial regions excluded from nuclear genome analysis.
- subject: term:ONGA_0000131
  label: capture targets
  description: Genomic regions targeted for enrichment in capture-based sequencing (exome, panels).
- subject: term:ONGA_0000148
  label: raw data
  description: Unprocessed experimental data in original format before computational processing.
- subject: term:ONGA_0000149
  label: raw imaging signal
  description: Unprocessed signal from imaging-based experiments.
- subject: term:ONGA_0000143
  label: nanopore signal
  description: Raw ionic current signal from nanopore sequencing.
- subject: term:ONGA_0000134
  label: fragments
  description: DNA or RNA fragment data prior to alignment.
- subject: term:ONGA_0000153
  label: subreads
  description: Sub-read data from long-read sequencing platforms (PacBio).
- subject: term:ONGA_0000147
  label: R2C2 subreads
  description: Rolling circle amplification sub-reads from R2C2 long-read sequencing.
- subject: term:ONGA_0000138
  label: index reads
  description: Index read sequences for sample demultiplexing.
- subject: term:ONGA_0000135
  label: idat green channel
  description: Green channel intensity data from Illumina IDAT microarray files.
- subject: term:ONGA_0000136
  label: idat red channel
  description: Red channel intensity data from Illumina IDAT microarray files.
- subject: term:ONGA_0000139
  label: intensity values
  description: Raw intensity measurements from microarray or imaging experiments.
- subject: term:ONGA_0000140
  label: kmer weights
  description: Frequency or weight values for k-mer sequences.
- subject: term:ONGA_0000141
  label: library fraction
  description: Proportion of sequencing library represented by a sample or subset.
- subject: term:ONGA_0000146
  label: primer sequence
  description: Oligonucleotide primer sequences used in PCR or sequencing.
- subject: term:ONGA_0000144
  label: negative control regions
  description: Genomic regions used as negative controls in experiments.
- subject: term:ONGA_0000145
  label: positive control regions
  description: Genomic regions used as positive controls in experiments.
- subject: term:ONGA_0000137
  label: inclusion list
  description: Allowlist of genomic regions or barcodes included in analysis.
- subject: term:ONGA_0000133
  label: filtered regions
  description: Genomic regions removed from analysis after filtering.
- subject: term:ONGA_0000154
  label: validation
  description: Data generated for experimental validation purposes.
- subject: term:ONGA_0000206
  label: PWMs
  description: Position weight matrices representing sequence motif models, encoding nucleotide preferences at each 
    position.
- subject: term:ONGA_0000207
  label: sequence motifs
  description: Sequence patterns enriched in genomic regions of interest.
- subject: term:ONGA_0000208
  label: sequence motifs instances
  description: Genomic locations where specific sequence motifs occur.
- subject: term:ONGA_0000209
  label: sequence motifs report
  description: Summary report of motif discovery or enrichment analysis.
- subject: term:ONGA_0000218
  label: transcriptome annotations
  description: Comprehensive gene and transcript annotations for a genome.
- subject: term:ONGA_0000122
  label: HMM predicted chromatin state
  description: Chromatin state annotations (e.g., ChromHMM) predicted by hidden Markov model from histone marks.
- subject: term:ONGA_0000216
  label: splice junctions
  description: Splice site junctions identified from RNA-seq alignments.
- subject: term:ONGA_0000217
  label: transcribed fragments
  description: Genomic regions identified as transcribed from RNA-seq data.
- subject: term:ONGA_0000212
  label: miRNA annotations
  description: Annotation tracks for microRNA genes and precursors.
- subject: term:ONGA_0000213
  label: repeat elements annotation
  description: Annotation of repetitive element locations and classes.
- subject: term:ONGA_0000214
  label: restriction enzyme site locations
  description: Genomic positions of restriction enzyme recognition sites.
- subject: term:ONGA_0000125
  label: sequence alignability
  description: Track indicating mappability of sequences to the reference genome.
- subject: term:ONGA_0000126
  label: sequence uniqueness
  description: Track indicating uniqueness of k-mer sequences across the genome.
- subject: term:ONGA_0000210
  label: functional conservation mapping
  description: Mapping of functionally conserved regions across species.
- subject: term:ONGA_0000211
  label: functional conservation quantifications
  description: Quantification of functional conservation scores.
retired:
- label: filtered reads
  description: Sequencing reads passing quality control filters such as minimum quality score, adapter removal, or 
    duplicate marking.
- label: haplotype-specific alignments
  description: Reads confidently assigned and aligned to a specific parental haplotype based on phased variant 
    information.
- label: unfiltered alignments
  description: Raw alignments before quality filtering, duplicate removal, or other post-processing.
- label: signal of all reads
  description: Signal computed from all aligned reads regardless of mapping quality or uniqueness.
- label: signal of unique reads
  description: Signal computed only from uniquely mapping reads (typically MAPQ >= 30), excluding multi-mappers.
- label: read-depth normalized signal
  description: Signal normalized by total sequencing depth to enable cross-sample comparisons.
- label: raw signal
  description: Unprocessed signal track before normalization or bias correction.
- label: percentage normalized signal
  description: Signal expressed as a percentage of total signal, useful for comparing relative enrichment.
- label: minus strand signal
  description: Signal values computed from reads mapping to the minus (reverse/Crick) DNA strand.
- label: plus strand signal
  description: Signal values computed from reads mapping to the plus (forward/Watson) DNA strand.
- label: minus strand signal of all reads
  description: Minus strand signal from all aligned reads regardless of mapping quality.
- label: minus strand signal of unique reads
  description: Minus strand signal from uniquely mapping reads only (MAPQ >= threshold).
- label: plus strand signal of all reads
  description: Plus strand signal from all aligned reads regardless of mapping quality.
- label: plus strand signal of unique reads
  description: Plus strand signal from uniquely mapping reads only (MAPQ >= threshold).
- label: predicted signal profile
  description: Signal profile computationally predicted by a model from sequence or chromatin features.
- label: observed signal profile
  description: Experimentally measured signal profile from sequencing data.
- label: predicted bias profile
  description: Computationally predicted sequencing bias profile based on sequence composition.
- label: observed bias profile
  description: Empirically measured sequencing bias profile from experimental data.
- label: normalized predicted signal profile
  description: Predicted signal profile normalized for sequencing depth or library size.
- label: normalized observed signal profile
  description: Observed signal profile normalized for sequencing depth or library size.
- label: filtered peaks
  description: Peak calls after quality filtering, typically removing peaks in blacklist regions or with low signal.
- label: IDR thresholded peaks
  description: Peaks passing an Irreproducible Discovery Rate (IDR) threshold, indicating reproducible signal across 
    replicates.
- label: allele-specific contact matrix
  description: Chromatin contact matrix resolved to individual alleles using phased variants.
- label: haplotype-specific contact matrix
  description: Contact matrix computed separately for a specific parental haplotype.
- label: minus strand m6A methylation state
  description: N6-methyladenosine (m6A) modification on minus strand transcripts. m6A is the most abundant internal mRNA
    modification.
- label: plus strand m6A methylation state
  description: N6-methyladenosine (m6A) modification on plus strand transcripts.
- label: minus strand m5C methylation state
  description: 5-methylcytosine (m5C) RNA modification on the minus strand.
- label: plus strand m5C methylation state
  description: 5-methylcytosine (m5C) RNA modification on the plus strand.
- label: minus strand pseudouridine methylation state
  description: Pseudouridine (Ψ) modification on the minus strand. Pseudouridine is the most abundant RNA modification.
- label: plus strand pseudouridine methylation state
  description: Pseudouridine (Ψ) modification on the plus strand.
- label: minus strand inosine methylation state
  description: Inosine (A-to-I editing) modification on the minus strand.
- label: plus strand inosine methylation state
  description: Inosine (A-to-I editing) modification on the plus strand.
- label: minus strand Nm methylation state
  description: 2′-O-methylation (Nm) modification on the minus strand.
- label: plus strand Nm methylation state
  description: 2′-O-methylation (Nm) modification on the plus strand.
- label: predicted transcription start sites
  description: Computationally predicted TSS based on sequence or chromatin features.
- label: sparse gene count matrix of all reads
  description: Sparse gene count matrix including all reads regardless of mapping quality.
- label: sparse gene count matrix of unique reads
  description: Sparse gene count matrix from uniquely mapping reads only.
- label: depth normalized signals matrix
  description: Matrix of read-depth normalized signals across features and samples.
- label: phased variant calls
  description: Variants with haplotype phase resolved, indicating which alleles co-occur on the same chromosome.
- label: filtered SNPs
  description: Single nucleotide polymorphisms after quality filtering.
- label: filtered indels
  description: Insertion/deletion variants after quality filtering.
- label: female genome reference
  description: Reference genome sequence derived from a female individual (includes both X chromosomes).
- label: male genome reference
  description: Reference genome sequence derived from a male individual (includes X and Y chromosomes).
- label: female genome index
  description: Alignment index built from a female reference genome.
- label: male genome index
  description: Alignment index built from a male reference genome.
- label: phased mapping
  description: Sequence data with haplotype phase information resolved.
