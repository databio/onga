# Review tracks and types for ONGA: the queue split by what is being reviewed
# (track), then by kind of work (type), one question each. Read by
# `cwb review` (writes curation/review.json); the review site
# (curate.databio.org) renders it.
#
# A queue item belongs to the track of its subject kind; inside it, to every
# type whose `rules` match one of its open findings, or to the type with
# `fallback: true` when none match. `answers_kind` names the answer builder a
# review page uses for that type's buttons (links, definitions, duplicates,
# structure, keep-or-cut, fields, signoff). `help` is one short line under
# the type page's question.
#
# Version 2 keys: `title` (display name, also `{project}` in default answer
# rationales), `reasons` (finding rule -> plain words; see the README),
# `answers` (per answers_kind settings) and `more_links` (the More menu).

version: 2
title: ONGA

reasons:
  no-mapping-at-all:
    text: Not linked to any outside ontology.
    hide_if: [unmapped-high-usage]
  unmapped-high-usage:
    pattern: 'has (?P<n>\d+) ENCODE files'
    text: Used by {n:,} ENCODE files, but not linked to any outside ontology.
    else: Used by many ENCODE files, but not linked to any outside ontology.
  unreviewed-mapping:
    pattern: "' (?P<link>\\S+ \\S+) has no mapping"
    text: "Has a link nobody has checked: {link}."
    else: "Has a link nobody has checked: {message}."
  class-no-alignment: {text: Does not point to any outside standard.}
  coverage-gap: {text: The automatic matcher found nothing similar in other ontologies.}
  mapping-suggestion: {hide: true}
  terse-description:
    pattern: 'is (?P<n>\d+) chars'
    text: Definition is very short ({n} characters).
    else: Definition is very short.
  enum-value-no-description: {text: Has no definition.}
  todo-marker:
    pattern: 'comment (?P<note>.*)$'
    text: "Has a TODO note: {note}"
    else: "Has a TODO note: {message}"
  similar-terms:
    pattern: 'similarity (?P<score>[\d.]+)'
    text: Reads almost the same as "{other}" ({score:.0%} similar).
    else: Reads almost the same as "{other}".
  residual-compound:
    pattern: 'contains facet word\(s\) (?P<words>.+?) and has no'
    text: 'Contains the facet word "{words}": it might be two ideas glued together.'
    else: It might be two ideas glued together.
  inline-enum:
    pattern: 'defined inside class module (?P<module>\S+)'
    text: Defined inside the class module "{module}" rather than in a vocabulary module.
    else: Defined inside a class module rather than in a vocabulary module.
  shared-slot:
    pattern: 'listed by (?P<classes>[^;]+)'
    text: "Used by more than one class: {classes}."
    else: Used by more than one class.
  mapping-target-is-doc-link:
    pattern: 'value (?P<target>\S+) is a documentation page'
    text: Points to a web page ({target}), not to a term.
    else: Points to a web page, not to a term.
  zero-usage-term: {text: No ENCODE file uses this term.}
  orphan-facet-value: {text: Nothing else refers to this value.}
  required-policy: {text: "Marked required, but it is not an identifier. Every required field is extra work for adopters."}
  slot-no-examples: {text: Has no examples.}

answers:
  links:
    # SO uses the element-type predicate (set/element rule, mappings/policy.yaml);
    # EDAM gets closeMatch; anything else relatedMatch.
    predicates: {so: "onga:has_element_type", edam: "skos:closeMatch", "*": "skos:relatedMatch"}
    grades:
      # An SO link says what each feature in the set is, and needs a fit grade:
      # one button per grade, shown as a group after the word `group`.
      so:
        field: element_type_fit
        group: Accept
        rationale: "{label} {phrase} the kind of feature in this set."
        options:
          - {label: Exact fit, value: exact, phrase: is exactly}
          - {label: Close enough, value: approximate, phrase: is the nearest SO match for}
          - {label: SO term is broader, value: broad, phrase: is broader than}

more_links:
  - {label: Merge candidates, url: "https://dev.databio.org/onga/develop/merge-candidates"}
  - {label: Gaps, url: "https://dev.databio.org/onga/develop/gaps"}
  - {label: Lint, url: "https://dev.databio.org/onga/develop/lint"}
  - {label: Proposals, url: "https://dev.databio.org/onga/develop/so-proposals"}
  - {label: Usage, url: "https://dev.databio.org/onga/develop/frequency"}

tracks:
  - id: vocabulary
    title: Vocabulary
    blurb: The words ONGA uses to say what is in a file.
    kinds: [term, subset, enum]
    types:
      - id: links
        title: Links to other ontologies
        question: Does this term match a term in another ontology (EDAM, SO, PATO, ...)?
        help: Suggested by a matcher, or added earlier and never checked.
        rules: [mapping-suggestion, no-mapping-at-all, unmapped-high-usage, unreviewed-mapping, coverage-gap]
        answers_kind: links
      - id: duplicates
        title: Near-duplicates
        question: Is this the same thing as another term, or two ideas glued together?
        help: Terms that read almost the same, or might split into parts.
        rules: [similar-terms, residual-compound, inline-enum]
        answers_kind: duplicates
      - id: keep-or-cut
        title: Keep or cut
        question: Should this term exist at all?
        help: Terms no ENCODE file uses, and values nothing refers to.
        rules: [zero-usage-term, orphan-facet-value]
        answers_kind: keep-or-cut
      - id: definitions
        title: Definitions
        question: Is this definition clear and complete?
        help: Missing, very short, or marked TODO.
        rules: [terse-description, enum-value-no-description, todo-marker]
        answers_kind: definitions
      - id: signoff
        title: Sign-off
        question: Nothing was flagged. Is this right as it is?
        help: No known problems; nobody has looked yet.
        rules: []
        fallback: true
        answers_kind: signoff

  - id: schema
    title: Schema
    blurb: "The data model: record types (classes) and their fields."
    kinds: [class, slot, usage, module]
    types:
      - id: fields
        title: Required and examples
        question: Should this field be required, and does it show what a value looks like?
        help: Required fields cost every adopter; examples help them fill fields in.
        rules: [required-policy, slot-no-examples]
        answers_kind: fields
      - id: definitions
        title: Descriptions
        question: Is this description clear and complete?
        help: Very short, or marked TODO.
        rules: [terse-description, todo-marker]
        answers_kind: definitions
      - id: links
        title: Outside standards
        question: Does this class line up with an outside standard (DCAT, PROV-O, Phenopackets, ...)?
        help: Ported classes with no outside standard, or a web page instead of a term.
        rules: [class-no-alignment, mapping-target-is-doc-link]
        answers_kind: links
      - id: structure
        title: Shared fields
        question: Does this field mean the same thing in every class that uses it?
        help: Fields listed by more than one class.
        rules: [shared-slot]
        answers_kind: structure
      - id: signoff
        title: Sign-off
        question: Nothing was flagged. Is this right as it is?
        help: No known problems; nobody has looked yet.
        rules: []
        fallback: true
        answers_kind: signoff
